name: Update news data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect headlines and write summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update.py

      - name: Save results
        run: |
          git config user.name "world-affairs-bot"
          git config user.email "world-affairs-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update news data"
            git push
          fi
